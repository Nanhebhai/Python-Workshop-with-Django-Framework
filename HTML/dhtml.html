<html>

<body>
    <form method="post" action="success.html">
        <table border="1" align="center" bgcolor="aqua">
            <tr>
                <th colspan="2">Registration Form</th>
            </tr>
            <tr>
                <td>First Name</td>
                <td><input type="text" placeholder="Enter your name" required></td>
            </tr>
            <tr>
                <td>Last Name</td>
                <td><input type="text" placeholder="Enter your last name" required></td>
            </tr>
            <tr>
                <td>Mobile No.</td>
                <td><input type="text" placeholder="enter 10 digit no." maxlength="10" required></td>
            </tr>
            <tr>
                <td>DOB.</td>
                <td><input type="date" required></td>
            </tr>
            <tr>
                <td>Gender</td>
                <td><input type="radio" value="male" name="gender">male<input type="radio" value="female"
                        name="gender" required>female</td>
            </tr>
            <tr>
                <td>Address</td>
                <td><textarea name="" id="" rows="3" cols="20" placeholder="enter address"></textarea></td>
            </tr>
            <tr>
                <td>City</td>
                <td>
                    <select>
                        <option value="0">select city</option>
                        <option value="1">indore</option>
                        <option value="2">bhopal</option>
                        <option value="3">harda</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>email</td>
                <td><input type="email" placeholder="enter email" required></td>
            </tr>
            <tr>
                <td>password</td>
                <td><input type="password" minlength="8" maxlength="13" required></td>
            </tr>
            <tr>
                <td>profile pic.</td>
                <td><input type="file"></td>
            </tr>
             <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="create profile">
                    <input type="reset" value="reset detail">
                </td>
            </tr>
        </table>
    </form>
</body>

</html>
